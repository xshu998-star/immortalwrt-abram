name: 编译 ImmortalWrt 25.12 (AN7581 NPU Debug Ultimate)

on:
  workflow_dispatch:
  push:
    branches:
      - openwrt-25.12

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    - name: 检出仓库
      uses: actions/checkout@v4

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt update

        sudo apt install -y \
          ack \
          antlr3 \
          asciidoc \
          autoconf \
          automake \
          autopoint \
          binutils \
          bison \
          build-essential \
          bzip2 \
          ccache \
          clang \
          cmake \
          cpio \
          curl \
          device-tree-compiler \
          fastjar \
          flex \
          gawk \
          gettext \
          gcc-multilib \
          g++-multilib \
          git \
          gperf \
          haveged \
          help2man \
          intltool \
          libc6-dev-i386 \
          libelf-dev \
          libglib2.0-dev \
          libgmp3-dev \
          libltdl-dev \
          libmpc-dev \
          libmpfr-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libpython3-dev \
          libreadline-dev \
          libssl-dev \
          libtool \
          lrzsz \
          mkisofs \
          msmtp \
          nano \
          ninja-build \
          p7zip \
          p7zip-full \
          patch \
          pkgconf \
          python3 \
          python3-pip \
          python3-ply \
          python3-docutils \
          python3-pyelftools \
          qemu-utils \
          rsync \
          scons \
          squashfs-tools \
          subversion \
          swig \
          texinfo \
          uglifyjs \
          unzip \
          vim \
          wget \
          xmlto \
          xxd \
          zlib1g-dev

        sudo timedatectl set-timezone "$TZ"

    - name: 启用 ccache
      run: |
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
        echo "CCACHE_COMPRESS=1" >> $GITHUB_ENV
        echo "CCACHE_MAXSIZE=2G" >> $GITHUB_ENV

    - name: 克隆源码
      run: |
        git clone \
          --depth=1 \
          --single-branch \
          --branch=openwrt-25.12 \
          https://github.com/xshu998-star/immortalwrt-abram.git

    - name: 应用 040.config
      run: |
        cd immortalwrt-abram

        cp ../040.config .config

    - name: 更新 feeds
      run: |
        cd immortalwrt-abram

        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 搜索源码中的 HNAT/NPU
      run: |
        cd immortalwrt-abram

        echo "========== FIND HNAT =========="
        find package -iname "*hnat*" || true
        find feeds -iname "*hnat*" || true

        echo "========== FIND NPU =========="
        find package -iname "*npu*" || true
        find feeds -iname "*npu*" || true

        echo "========== GREP HNAT =========="
        grep -R "KernelPackage.*hnat" package feeds 2>/dev/null || true

        echo "========== GREP MTK-HNAT =========="
        grep -R "mtk-hnat" package feeds 2>/dev/null || true

        echo "========== GREP EN7581 =========="
        grep -R "en7581" target package feeds 2>/dev/null || true

    - name: 生成 defconfig
      run: |
        cd immortalwrt-abram

        make defconfig

    - name: 验证关键配置
      run: |
        cd immortalwrt-abram

        echo "========== HNAT =========="
        grep CONFIG_PACKAGE_kmod-mtk-hnat .config || true

        echo "========== FIREWALL4 =========="
        grep CONFIG_PACKAGE_firewall4 .config || true

        echo "========== NFTABLES =========="
        grep CONFIG_PACKAGE_nftables .config || true

        echo "========== FLOW OFFLOAD =========="
        grep CONFIG_PACKAGE_kmod-nft-offload .config || true

        echo "========== TUN =========="
        grep CONFIG_PACKAGE_kmod-tun .config || true

        echo "========== NPU FIRMWARE =========="
        grep "npu" .config || true

    - name: 注入 APK 仓库
      run: |
        cd immortalwrt-abram

        mkdir -p files/etc/apk

        cat > files/etc/apk/repositories <<EOF
        https://downloads.immortalwrt.org/snapshots/targets/airoha/an7581/packages/packages.adb
        https://downloads.immortalwrt.org/snapshots/packages/aarch64_cortex-a53/base/packages.adb
        https://downloads.immortalwrt.org/snapshots/packages/aarch64_cortex-a53/luci/packages.adb
        https://downloads.immortalwrt.org/snapshots/packages/aarch64_cortex-a53/packages/packages.adb
        https://downloads.immortalwrt.org/snapshots/packages/aarch64_cortex-a53/routing/packages.adb
        https://downloads.immortalwrt.org/snapshots/packages/aarch64_cortex-a53/telephony/packages.adb
        EOF

    - name: 强制 IPv4
      run: |
        cd immortalwrt-abram

        mkdir -p files/etc

        cat > files/etc/wgetrc <<EOF
        inet4_only = on
        EOF

    - name: 添加固定 MAC
      run: |
        cd immortalwrt-abram

        mkdir -p files/etc/uci-defaults

        cat > files/etc/uci-defaults/99-fix-mac <<EOF
        #!/bin/sh

        CPU_SERIAL=\$(grep "Serial" /proc/cpuinfo | awk -F: '{print \$2}' | tr -d '[:space:]')

        if [ -z "\$CPU_SERIAL" ]; then
            CPU_SERIAL=\$(md5sum /dev/mtdblock0 2>/dev/null | awk '{print \$1}')
        fi

        HASH=\$(echo "\$CPU_SERIAL" | md5sum | cut -c1-10)

        MAC="02:\$(echo \$HASH | sed 's/../&:/g' | sed 's/:\$//')"

        uci set network.lan.macaddr="\$MAC"
        uci commit network

        rm -f /etc/uci-defaults/99-fix-mac
        EOF

        chmod +x files/etc/uci-defaults/99-fix-mac

    - name: 下载源码包
      run: |
        cd immortalwrt-abram

        make download -j$(nproc)

    - name: 编译固件
      run: |
        cd immortalwrt-abram

        make -j$(nproc) || make -j1 V=s

    - name: 检查编译结果
      run: |
        cd immortalwrt-abram

        echo "========== 查找 HNAT =========="
        find build_dir -name "*hnat*" || true

        echo "========== 查找 NPU =========="
        find build_dir -name "*npu*" || true

        echo "========== 查找 FLOW =========="
        find build_dir -name "*flow*" || true

        echo "========== 查找 NFT =========="
        find build_dir -name "*nft*" || true

    - name: 查看固件大小
      run: |
        cd immortalwrt-abram

        du -h bin/targets/airoha/an7581/* || true

    - name: 上传固件
      uses: actions/upload-artifact@v4
      with:
        name: immortalwrt-firmware
        path: |
          immortalwrt-abram/bin/targets/airoha/an7581/*.bin
          immortalwrt-abram/bin/targets/airoha/an7581/*.img.gz

    - name: 上传日志
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: immortalwrt-logs
        path: |
          immortalwrt-abram/.config
          immortalwrt-abram/bin/targets/airoha/an7581/config.buildinfo
          immortalwrt-abram/bin/targets/airoha/an7581/feeds.buildinfo
          immortalwrt-abram/bin/targets/airoha/an7581/version.buildinfo