name: 编译 ImmortalWrt 25.12 (APK + MTK HNAT)

on:
  workflow_dispatch:
  push:
    branches:
      - openwrt-25.12

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检出你的仓库
      uses: actions/checkout@v4

    - name: 安装编译依赖
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          clang \
          flex \
          bison \
          g++ \
          gawk \
          gcc-multilib \
          gettext \
          git \
          libncurses5-dev \
          libssl-dev \
          python3 \
          python3-pyelftools \
          rsync \
          unzip \
          zlib1g-dev \
          file \
          wget

    - name: 克隆源码
      run: |
        git clone --depth=1 \
          --single-branch \
          --branch=openwrt-25.12 \
          https://github.com/xshu998-star/immortalwrt-abram.git

    - name: 应用 040.config
      run: |
        cd immortalwrt-abram
        cp ../040.config .config

    - name: 更新 Feeds
      run: |
        cd immortalwrt-abram
        ./scripts/feeds update -a
        ./scripts/feeds install -f -a

    - name: 生成 defconfig
      run: |
        cd immortalwrt-abram
        make defconfig

    - name: 验证 HNAT 是否启用
      run: |
        cd immortalwrt-abram
        grep CONFIG_PACKAGE_kmod-mtk-hnat .config

    - name: 注入 APK 仓库
      run: |
        cd immortalwrt-abram

        mkdir -p files/etc/apk

        cat > files/etc/apk/repositories <<EOF
        https://downloads.immortalwrt.org/snapshots/targets/airoha/an7581/packages/packages.adb
        https://downloads.immortalwrt.org/snapshots/packages/aarch64_cortex-a53/base/packages.adb
        https://downloads.immortalwrt.org/snapshots/packages/aarch64_cortex-a53/luci/packages.adb
        https://downloads.immortalwrt.org/snapshots/packages/aarch64_cortex-a53/packages/packages.adb
        https://downloads.immortalwrt.org/snapshots/packages/aarch64_cortex-a53/routing/packages.adb
        https://downloads.immortalwrt.org/snapshots/packages/aarch64_cortex-a53/telephony/packages.adb
        EOF

    - name: 强制 wget/apk 使用 IPv4
      run: |
        cd immortalwrt-abram

        mkdir -p files/etc

        cat > files/etc/wgetrc <<EOF
        inet4_only = on
        EOF

    - name: 固定 MAC 地址
      run: |
        cd immortalwrt-abram

        mkdir -p files/etc/uci-defaults

        cat > files/etc/uci-defaults/99-fix-mac <<EOF
        #!/bin/sh

        CPU_SERIAL=\$(grep "Serial" /proc/cpuinfo | awk -F: '{print \$2}' | tr -d '[:space:]')

        if [ -z "\$CPU_SERIAL" ]; then
            CPU_SERIAL=\$(md5sum /dev/mtdblock0 2>/dev/null | awk '{print \$1}')
        fi

        MAC="02:\$(echo "\$CPU_SERIAL" | md5sum | cut -c1-10 | sed 's/../&:/g' | sed 's/:\$//')"

        uci set network.lan.macaddr="\$MAC"
        uci commit network

        rm -f /etc/uci-defaults/99-fix-mac
        EOF

        chmod +x files/etc/uci-defaults/99-fix-mac

    - name: 下载源码包
      run: |
        cd immortalwrt-abram
        make download -j$(nproc)

    - name: 编译固件
      run: |
        cd immortalwrt-abram
        make -j$(nproc) || make -j1 V=s

    - name: 检查 HNAT 模块
      run: |
        cd immortalwrt-abram

        find bin/targets/ -name "*mtk*hnat*" || true

    - name: 上传固件
      uses: actions/upload-artifact@v4
      with:
        name: immortalwrt-firmware
        path: |
          immortalwrt-abram/bin/targets/airoha/an7581/*.bin
          immortalwrt-abram/bin/targets/airoha/an7581/*.img.gz
